<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox Challenge: You've Got Mail! · A2</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');
:root{--ink:#24344a;--blue:#183b67;--gold:#ffca65;--paper:#fffdf7}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:'DM Sans',Arial,sans-serif;background:#c3d2d5}.desk{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#e9ece5 0%,#d6ddd9 55%,#b5c8c9 100%);padding:26px 24px 38px}.desk:before{content:"";position:absolute;inset:0;opacity:.22;pointer-events:none;background:repeating-linear-gradient(15deg,transparent 0 40px,#fff 41px 42px)}.top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:15px;max-width:1260px;margin:auto}.brand{display:flex;gap:14px;align-items:center}.logo{background:#193a63;color:#fff;padding:14px;border-radius:17px;box-shadow:0 6px 20px #203b4b2b}.brand h1{font-size:clamp(23px,3vw,37px);line-height:1;margin:0;font-weight:800;letter-spacing:-1.2px}.brand p{margin:7px 0 0;font-size:12px;font-weight:700;letter-spacing:2px;color:#557086}.counter{background:#fffdf7d9;padding:13px 19px;border:1px solid #fff;border-radius:18px;box-shadow:0 7px 25px #2c50621c;font-weight:800}.counter b{color:#e48135}.work{position:relative;max-width:1260px;margin:24px auto 0;min-height:690px;border-radius:28px;background:linear-gradient(135deg,#e5c6a4,#d8ae85 50%,#bd8b64);border:10px solid #f2e0c9;box-shadow:0 25px 65px #324b5660,inset 0 0 90px #86552b38;overflow:hidden}.work:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,#fff 0 2px,transparent 2px 46px)}.instruction{position:absolute;top:24px;left:27px;background:#fffdf2;padding:15px 23px;border-radius:4px;box-shadow:3px 8px 13px #664b3b3b;transform:rotate(-3deg);z-index:2;font-weight:800;font-size:clamp(15px,2vw,22px)}.instruction small{display:block;font-size:12px;font-weight:600;color:#62738a;margin-top:4px}.mug{position:absolute;right:45px;top:20px;width:105px;height:105px;border-radius:50%;background:radial-gradient(circle,#64412c 0 36%,#efe4d4 37% 47%,#fffdf6 48% 65%,#d9d5ce 66%);box-shadow:0 10px 15px #4c342e44}.mug:after{content:"";position:absolute;width:40px;height:46px;border:13px solid #fffdf6;border-radius:50%;right:-24px;top:31px;z-index:-1}.pen{position:absolute;right:75px;bottom:70px;width:16px;height:150px;border-radius:10px;background:linear-gradient(90deg,#123e68,#5293b5,#14365b);transform:rotate(36deg);box-shadow:5px 6px 8px #463a3355}.note{position:absolute;bottom:32px;left:32px;background:#fff0a9;padding:18px 23px;transform:rotate(-8deg);box-shadow:3px 6px 12px #4a3b2f35;font-size:13px;line-height:1.8;font-weight:700}.letters{position:relative;z-index:1;min-height:690px}.envelope{position:absolute;width:clamp(225px,25%,325px);height:165px;border:0;background:linear-gradient(145deg,#fffefa,#e9e7dc);border-radius:7px;box-shadow:0 12px 15px #644b3e4a,0 1px 2px #3d3d3d40;cursor:pointer;transition:transform .25s,filter .25s;transform:rotate(var(--r));text-align:left;color:#24344a;padding:16px 19px;isolation:isolate}.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(150deg,transparent 49.6%,#c7c9c3 50%,transparent 50.6%),linear-gradient(210deg,transparent 49.6%,#c7c9c3 50%,transparent 50.6%);opacity:.48;pointer-events:none;z-index:-1}.envelope:after{content:"";position:absolute;bottom:0;left:0;right:0;height:54%;clip-path:polygon(0 100%,50% 18%,100% 100%);background:linear-gradient(#f8f7f1,#e7e8df);border-radius:0 0 7px 7px;z-index:-1}.envelope:hover{transform:rotate(0deg) translateY(-11px) scale(1.04);filter:brightness(1.02);z-index:5}.envelope.done{filter:saturate(.65);opacity:.72}.stamp{position:absolute;right:13px;top:12px;border:2px dashed #8da8b9;background:#dcecf2;padding:9px 8px;font-size:20px;border-radius:3px}.env-id{display:inline-block;font-size:11px;font-weight:800;color:#758a99;letter-spacing:2px}.env-from{font-size:19px;font-weight:800;margin:10px 0 4px;max-width:190px}.env-sub{font-size:13px;font-weight:700;color:#687c8b;max-width:180px}.seal{position:absolute;bottom:18px;right:19px;background:#d75e5a;color:white;padding:5px 10px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:1px}.done .seal{background:#348e73}.e0{top:130px;left:6%;--r:-8deg}.e1{top:115px;left:38%;--r:5deg}.e2{top:155px;right:4%;--r:-5deg}.e3{top:390px;left:11%;--r:6deg}.e4{top:400px;left:40%;--r:-7deg}.e5{top:410px;right:3%;--r:7deg}.toolbar{position:relative;z-index:3;display:flex;justify-content:center;gap:12px;margin:17px auto;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 19px;background:#173e69;color:white;font:800 14px 'DM Sans',Arial;cursor:pointer;box-shadow:0 4px 10px #253c4d2b}.btn.secondary{background:#fffdf6;color:#1d466e}.btn:disabled{opacity:.45;cursor:not-allowed}.btn:hover:not(:disabled){filter:brightness(1.12)}.overlay{position:fixed;inset:0;background:#112a42a9;display:none;place-items:center;z-index:30;padding:15px;backdrop-filter:blur(5px)}.overlay.open{display:grid}.modal{width:min(750px,96vw);max-height:94vh;overflow:auto;background:#fffefa;border-radius:19px;box-shadow:0 30px 100px #0d1e37a0;animation:pop .25s ease}.modalhead{background:#173d68;color:white;padding:20px 25px;display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:21px}.close{border:0;background:#ffffff24;color:white;font-size:25px;width:36px;height:36px;border-radius:9px;cursor:pointer}.modalbody{padding:22px 26px 27px}.from{color:#5d7286;font-size:13px;border-bottom:1px solid #e2e8e9;padding-bottom:14px;margin-bottom:18px}.from strong{color:#253c52}.intro{font-size:16px;font-weight:800;margin:0 0 16px}.q{background:#f2f6f7;padding:12px 14px;margin:9px 0;border-radius:10px;font-size:14px;line-height:1.5}.q label{display:block;font-weight:700;margin-bottom:7px}.q input,.q textarea,.q select{width:100%;padding:11px 12px;border:1px solid #cbd7de;border-radius:8px;font:15px 'DM Sans',Arial;background:white;color:#263b4e}.q textarea{min-height:75px;resize:vertical}.q select{cursor:pointer}.q input:focus,.q textarea:focus,.q select:focus{outline:2px solid #5b9fc4}.modalfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:19px}.hint{font-size:12px;color:#6a8092}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#193e66;color:white;padding:14px 25px;border-radius:12px;box-shadow:0 10px 35px #132f4b55;z-index:60;display:none}.report{display:none;position:fixed;inset:0;z-index:50;background:#e6ebec;overflow:auto;padding:25px}.report.show{display:block}.reportpage{max-width:800px;margin:auto;background:white;padding:36px 44px;box-shadow:0 10px 35px #40546833}.reportpage h1{margin:0;color:#183b67}.reportpage .sub{color:#687e91;margin:6px 0 24px}.reportblock{break-inside:avoid;margin:15px 0 24px;padding:14px;border:1px solid #e2e8ed;border-radius:9px}.reportblock h3{margin:0 0 12px}.reportblock p{font-size:13px;line-height:1.55;margin:9px 0}.reportblock strong{color:#193e66}.reporttools{display:flex;gap:10px;justify-content:center;margin:0 auto 18px;flex-wrap:wrap}@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}@media(max-width:800px){.work,.letters{min-height:950px}.envelope{width:42%;height:150px}.e0{top:130px;left:5%}.e1{top:130px;left:53%}.e2{top:335px;left:5%}.e3{top:335px;left:53%}.e4{top:540px;left:5%}.e5{top:540px;left:53%}.mug{transform:scale(.7);right:5px}.pen{display:none}.note{bottom:15px}.env-from{font-size:16px}}@media(max-width:480px){.desk{padding:13px 8px}.work{border-width:5px}.envelope{width:45%;height:148px;padding:10px}.stamp{font-size:14px;padding:4px}.env-from{font-size:14px}.env-sub{font-size:11px}.e0,.e2,.e4{left:3%}.e1,.e3,.e5{left:52%}.modalbody{padding:16px}.reportpage{padding:20px}}@media print{body{background:white}.desk,.overlay,.reporttools{display:none!important}.report{display:block!important;position:static;padding:0;background:white;overflow:visible}.reportpage{box-shadow:none;padding:0;max-width:none}.reportblock{break-inside:avoid}}
</style></head><body><main class="desk"><header class="top"><div class="brand"><div class="logo">✉</div><div><h1>INBOX CHALLENGE</h1><p>PRESENT PERFECT × PAST SIMPLE · A2</p></div></div><div class="counter">✉ <b id="count">6</b> unread</div></header><section class="work"><div class="instruction">Monday morning!<small>Open the emails. Send your answers.</small></div><div class="mug"></div><div class="pen"></div><div class="note">TO DO<br>☐ Read emails<br>☐ Reply<br>☐ Send report</div><div class="letters" id="letters"></div></section><div class="toolbar"><button class="btn secondary" onclick="showReport()">Teacher's Report</button><button class="btn secondary" onclick="resetGame()">Start again</button></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" aria-label="Close" onclick="closeModal()">×</button></div><div class="modalbody"><div class="from" id="from"></div><p class="intro" id="intro"></p><div id="questions"></div><div class="modalfoot"><span class="hint">No wrong answers block sending.</span><button class="btn" onclick="sendMail()">Send reply →</button></div></div></div></div><div class="toast" id="toast"></div><section class="report" id="report"><div class="reporttools"><button class="btn" onclick="window.print()">Save as PDF / Print</button><button class="btn secondary" onclick="copyReport()">Copy report</button><button class="btn secondary" onclick="hideReport()">Back to desk</button></div><div class="reportpage" id="reportpage"></div></section><script>
const mails=[
{from:'Anna · HR',sub:'A few questions',intro:'Write the questions.',items:[['Yes, I have worked here for five years.','How long ...?'],['I started this job in 2019.','When ...?'],['No, I have never worked from home.','Have ...?']]},
{from:'Mark · Manager',sub:'Project update',intro:'Choose the correct ending.',items:[['I have already finished the report,','a) yesterday at 4 p.m. | b) so you can read it now.'],['I finished the report','a) last Friday. | b) since Friday.'],['We have worked with this client','a) in 2020. | b) for three years.']]},
{from:'Julia · Colleague',sub:'Coffee break',intro:'Write the questions.',items:[['Yes, I have tried the new café.','Have ...?'],['I went there last Saturday.','When ...?'],['No, I haven’t had lunch yet.','Have ...?']]},
{from:'David · Client',sub:'Your order',intro:'Choose the correct form.',items:[['We ___ your order yesterday.','send / sent / have sent'],['I ___ your email already.','read / have read / did read'],['___ you call the office last week?','Did / Have / Has']]},
{from:'IT Support',sub:'Small problems',intro:'Correct the sentences.',items:[['I have changed my password yesterday.','Write the correct sentence.'],['Did you ever use this program?','Write the correct sentence.'],['I haven’t sent the file last Monday.','Write the correct sentence.']]},
{from:'The Manager',sub:'End-of-day update',intro:'Write a short update. 4–6 sentences.',items:[['What have you finished today?','Present Perfect'],['What did you do yesterday?','Past Simple'],['What haven’t you done yet?','Present Perfect'],['When did you last speak to a colleague or customer?','Past Simple']]}
];let saved={};try{saved=JSON.parse(localStorage.getItem('officeInboxA2Deluxe')||'{}')}catch(e){}let active=-1;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.getElementById('letters').innerHTML=mails.map((m,i)=>`<button class="envelope e${i} ${saved[i]?'done':''}" onclick="openMail(${i})"><span class="env-id">MAIL 0${i+1}</span><span class="stamp">${['✉','▤','☕','▣','⌘','★'][i]}</span><div class="env-from">${esc(m.from)}</div><div class="env-sub">${esc(m.sub)}</div><span class="seal">${saved[i]?'SENT ✓':'NEW'}</span></button>`).join('');document.getElementById('count').textContent=mails.length-Object.keys(saved).length}function openMail(i){active=i;const m=mails[i];document.getElementById('modalTitle').textContent=m.sub;document.getElementById('from').innerHTML=`<strong>From:</strong> ${esc(m.from)} &nbsp; · &nbsp; <strong>To:</strong> You`;document.getElementById('intro').textContent=m.intro;document.getElementById('questions').innerHTML=m.items.map((q,j)=>`<div class="q"><label>${j+1}. ${esc(q[0])}</label>${i===1||i===3?`<select data-q="${j}"><option value="">Choose...</option>${(i===1?q[1].split(' | '):q[1].split(' / ')).map(v=>`<option ${saved[i]?.[j]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:`<textarea data-q="${j}" placeholder="${esc(q[1])}">${esc(saved[i]?.[j]||'')}</textarea>`}</div>`).join('');document.getElementById('overlay').classList.add('open')}function closeModal(){document.getElementById('overlay').classList.remove('open');active=-1}function sendMail(){if(active<0)return;let arr=[...document.querySelectorAll('[data-q]')].map(x=>x.value.trim());saved[active]=arr;localStorage.setItem('officeInboxA2Deluxe',JSON.stringify(saved));closeModal();render();const t=document.getElementById('toast');t.textContent='Reply sent! ✓';t.style.display='block';setTimeout(()=>t.style.display='none',1600);if(Object.keys(saved).length===6)setTimeout(()=>showReport(),650)}function reportText(){return 'INBOX CHALLENGE — TEACHER’S REPORT\nPresent Perfect vs Past Simple · A2\nCompleted: '+Object.keys(saved).length+'/6 emails\n\n'+mails.map((m,i)=>'EMAIL '+(i+1)+' — '+m.from+' — '+m.sub+'\n'+m.items.map((q,j)=>(j+1)+'. '+q[0]+'\nAnswer: '+(saved[i]?.[j]||'[Not answered]')).join('\n')+'\n').join('\n')}function showReport(){document.getElementById('reportpage').innerHTML=`<h1>Teacher's Report</h1><p class="sub">Inbox Challenge · Present Perfect vs Past Simple · A2<br>${Object.keys(saved).length} / 6 emails sent</p>`+mails.map((m,i)=>`<div class="reportblock"><h3>${i+1}. ${esc(m.from)} — ${esc(m.sub)} ${saved[i]?'✓':'· not sent'}</h3>${m.items.map((q,j)=>`<p>${j+1}. ${esc(q[0])}<br><strong>Answer:</strong> ${esc(saved[i]?.[j]||'—')}</p>`).join('')}</div>`).join('');document.getElementById('report').classList.add('show')}function hideReport(){document.getElementById('report').classList.remove('show')}async function copyReport(){try{await navigator.clipboard.writeText(reportText());alert('Report copied!')}catch(e){alert('Select the report and copy it.')}}function resetGame(){if(confirm('Start again? This will clear all answers.')){saved={};localStorage.removeItem('officeInboxA2Deluxe');hideReport();render()}}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});render();
</script></body></html>
